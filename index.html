<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --g:#2e7d32; --g2:#92d050; --y:#ffeb3b; --r:#c62828; --bg:#f4f6f3; --line:#d7dcd4; --tx:#1d231c; --mu:#5f6b5c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--tx); font-size:16px; }
  .top { background:var(--g); color:#fff; padding:12px 16px; font-weight:700; letter-spacing:.3px; position:sticky; top:0; z-index:5; }
  .top small { font-weight:400; opacity:.85; margin-left:6px; }
  main { max-width:520px; margin:0 auto; padding:16px; }
  .screen { display:none; } .screen.on { display:block; }
  h1 { font-size:22px; margin:8px 0 18px; } h2 { font-size:18px; margin:4px 0 6px; }
  .hint { color:var(--mu); font-size:13px; margin:0 0 14px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--mu); margin:12px 0 4px; }
  .req { color:var(--r); }
  .row { display:flex; gap:8px; }
  input { flex:1; width:100%; font-size:18px; padding:12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; }
  input:focus { outline:none; border-color:var(--g); box-shadow:0 0 0 3px rgba(46,125,50,.15); }
  .cam { width:54px; flex:none; font-size:22px; border:1.5px solid var(--line); border-radius:10px; background:#fff; }
  button { font-family:inherit; cursor:pointer; }
  .big { display:block; width:100%; padding:16px; margin:10px 0; font-size:17px; font-weight:700; border-radius:12px; border:1.5px solid var(--line); background:#fff; color:var(--tx); text-align:left; }
  .big.primary { background:var(--g); border-color:var(--g); color:#fff; text-align:center; }
  .big.ghost { text-align:center; background:transparent; }
  .big .sub { display:block; font-weight:400; font-size:13px; color:var(--mu); margin-top:4px; }
  .big.done { border-color:var(--g2); background:#f6fbef; }
  .link { background:none; border:none; color:var(--g); font-size:15px; padding:10px 0; }
  .card { background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin:8px 0 14px; }
  .card .k { color:var(--mu); font-size:12px; } .card .v { font-weight:700; font-size:16px; word-break:break-all; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; }
  .status { margin-top:10px; padding:8px 10px; background:var(--y); border-radius:8px; font-weight:700; font-size:14px; }
  .khoTag { display:inline-block; background:var(--g); color:#fff; border-radius:6px; padding:1px 8px; }
  .kho { display:flex; gap:10px; margin:6px 0; }
  .kho button { flex:1; padding:16px 0; font-size:22px; font-weight:800; border-radius:12px; border:2px solid var(--line); background:#fff; }
  .kho button.sel { border-color:var(--g); background:var(--g); color:#fff; }
  .msg { display:none; margin:12px 0; padding:12px; border-radius:10px; font-size:15px; }
  .msg.on { display:block; } .msg.err { background:#fdecea; color:var(--r); border:1px solid #f5c2bd; }
  .msg.ok { background:#e8f5e9; color:var(--g); border:1px solid #b9dfbb; } .msg.warn { background:#fff8e1; color:#8a6d00; border:1px solid #ffe08a; }
  .msg .big { margin:10px 0 0; }
  .doneIcon { font-size:64px; text-align:center; margin:10px 0 0; }
  .scanned { border-color:var(--g2); background:#f6fbef; }
  #scanner { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; z-index:20; padding:14px; color:#fff; flex-direction:column; }
  #scanner.on { display:flex; }
  #scan-label { text-align:center; font-size:20px; font-weight:800; margin:4px 0 10px; }
  #scan-label small { display:block; font-size:13px; font-weight:400; opacity:.8; margin-top:2px; }
  #reader { width:100%; max-width:480px; margin:0 auto; background:#000; border-radius:12px; overflow:hidden; border:4px solid transparent; transition:border-color .2s; }
  #reader.hit { border-color:var(--g2); }
  #scan-got { max-width:480px; margin:10px auto 0; font-size:15px; min-height:20px; color:#c8e6c9; }
  #scan-err { color:#ffcdd2; font-size:14px; margin:8px auto; max-width:480px; }
  #scanner .big { max-width:480px; margin:10px auto 0; }
  .scanned h2 { color:var(--g); }
  .rec { outline:3px solid var(--g2); }
  #busy { position:fixed; inset:0; background:rgba(255,255,255,.6); display:none; align-items:center; justify-content:center; z-index:30; font-weight:700; }
  #busy.on { display:flex; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--g); color:#fff; padding:12px 18px; border-radius:24px; font-weight:600; display:none; z-index:25; max-width:92%; text-align:center; }
  #toast.on { display:block; }
</style>
</head>
<body>
<div class="top">AST WH · Theo dõi đơn<small id="clock"></small></div>
<main>

  <!-- 0. TRANG ĐẦU -->
  <section id="s-home" class="screen on">
    <div id="home-scan" class="card scanned" style="display:none"></div>
    <h1>Bạn muốn làm gì?</h1>
    <button class="big primary" id="btn-home-new" onclick="go('new')">➕ Tạo đơn hàng mới</button>
    <button class="big" id="btn-home-upd" onclick="homeUpd()">✏️ Cập nhật đơn hàng cũ<span class="sub">Quét STT + ID để mở đơn</span></button>
  </section>

  <!-- 1. TẠO ĐƠN MỚI -->
  <section id="s-new" class="screen">
    <h2>Bước 1 · Nhập thông tin đơn</h2>
    <p class="hint">Bấm 📷 để quét mã kế bên ô trên picklist, hoặc dùng máy quét cầm tay.</p>
    <label>Kho xử lý <span class="req">*</span></label>
    <div class="kho" id="new-kho"></div>
    <label>STT đơn hàng (NO.) <span class="req">*</span></label>
    <div class="row"><input id="n-stt" autocomplete="off"><button class="cam" onclick="scan('n-stt')">📷</button></div>
    <label>ID (WO ID) <span class="req">*</span></label>
    <div class="row"><input id="n-id" autocomplete="off"><button class="cam" onclick="scan('n-id')">📷</button></div>
    <label>Item <span class="req">*</span></label>
    <div class="row"><input id="n-item" autocomplete="off" style="text-transform:uppercase"><button class="cam" onclick="scan('n-item')">📷</button></div>
    <label>Line</label>
    <div class="row"><input id="n-line" list="lines" autocomplete="off"><button class="cam" onclick="scan('n-line')">📷</button></div>
    <datalist id="lines"></datalist><datalist id="names"></datalist>
    <div id="msg-new" class="msg"></div>
    <button class="big primary" onclick="submitNew()">Tạo đơn & tiếp tục</button>
    <button class="link" onclick="go('home')">← Về trang đầu</button>
  </section>

  <!-- 2. CẬP NHẬT ĐƠN CŨ -->
  <section id="s-upd" class="screen">
    <h2>Cập nhật đơn hàng cũ</h2>
    <p class="hint">Quét STT và ID. Kho được lấy theo STT đã tạo.</p>
    <label>STT đơn hàng (NO.) <span class="req">*</span></label>
    <div class="row"><input id="u-stt" autocomplete="off"><button class="cam" onclick="scan('u-stt')">📷</button></div>
    <label>ID (WO ID) <span class="req">*</span></label>
    <div class="row"><input id="u-id" autocomplete="off"><button class="cam" onclick="scan('u-id')">📷</button></div>
    <div id="msg-upd" class="msg"></div>
    <button class="big primary" onclick="submitUpd()">Mở đơn</button>
    <button class="link" onclick="go('home')">← Về trang đầu</button>
  </section>

  <!-- 3. MENU CHỨC NĂNG -->
  <section id="s-menu" class="screen">
    <div id="menu-card" class="card"></div>
    <h2>Chọn chức năng tiếp theo</h2>
    <div id="menu-btns"></div>
    <div id="msg-menu" class="msg"></div>
    <button class="big ghost" onclick="finish()">⏹ Không làm tiếp – Kết thúc</button>
  </section>

  <!-- 4. XÁC NHẬN CHỨC NĂNG -->
  <section id="s-act" class="screen">
    <h2 id="act-title"></h2>
    <div id="act-card" class="card"></div>
    <div id="act-warn" class="msg warn"></div>
    <div id="act-xuat" style="display:none">
      <label>Người nhận (sản xuất) <span class="req">*</span></label>
      <div class="row"><input id="a-nhan" list="names" autocomplete="off"><button class="cam" onclick="scan('a-nhan')">📷</button></div>
      <label>Người xuất (kho) <span class="req">*</span></label>
      <div class="row"><input id="a-xuat" list="names" autocomplete="off"><button class="cam" onclick="scan('a-xuat')">📷</button></div>
    </div>
    <div id="msg-act" class="msg"></div>
    <button class="big primary" onclick="confirmAct()">✔ Xác nhận</button>
    <button class="link" onclick="go('menu')">← Quay lại chọn chức năng</button>
  </section>

  <!-- 5. HOÀN TẤT -->
  <section id="s-done" class="screen">
    <div class="doneIcon">✅</div>
    <h1 style="text-align:center" id="done-title">Đã kết thúc thao tác</h1>
    <div id="done-card" class="card"></div>
    <button class="big primary" onclick="resetAll()">Làm đơn khác</button>
  </section>
</main>

<!-- MÀN HÌNH QUÉT (camera trực tiếp – chạy khi app mở từ GitHub Pages) -->
<div id="scanner">
  <div id="scan-label"></div>
  <div id="reader"></div>
  <div id="scan-got"></div>
  <div id="scan-err"></div>
  <button class="big primary" onclick="closeScan()">Xong</button>
  <button class="big ghost" style="color:#fff;border-color:#777" onclick="$('photo').click()">📸 Chụp ảnh mã (dự phòng)</button>
</div>
<input type="file" id="photo" accept="image/*" capture="environment" style="display:none" onchange="scanPhoto(this)">
<div id="busy">Đang xử lý…</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let KHO = ['OG', 'N2'];
let LABEL = { QAD: 'Xuất QAD', SOAN: 'Hoàn thành soạn đơn', XUAT: 'Xuất đơn' };
const ACTIONS = [
  { key: 'QAD',  icon: '🧾', sub: 'Ghi Ngày xuất QAD' },
  { key: 'SOAN', icon: '📦', sub: 'Ghi Ngày soạn xong' },
  { key: 'XUAT', icon: '🚚', sub: 'Ghi Ngày SX nhận + người nhận/xuất, rồi kết thúc' }
];
// Thứ tự trường khi quét mã gộp "STT|ID|ITEM|LINE|KHO"
const GROUPS = { new: ['n-stt', 'n-id', 'n-item', 'n-line'], upd: ['u-stt', 'u-id'], xuat: ['a-nhan', 'a-xuat'] };
const SUBMIT = { new: () => submitNew(), upd: () => submitUpd(), xuat: () => confirmAct() };
const S = { order: null, action: null, newKho: null };

/* ---------- kết nối server ----------
   Trong Apps Script: dùng google.script.run.
   Trên GitHub Pages: gọi API_URL (doPost trong Code.gs). */
const API_URL = 'https://script.google.com/macros/s/AKfycbzAqFaKWtHm0dstXRR6-JdbCideIqTKcUPmCgwzLYhf_U6J5IjYmxYs-BI0onD8X7Ua/exec';
const IN_GAS = !!(window.google && google.script && google.script.run);
function api(fn, payload) {
  if (IN_GAS) return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](payload));
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, payload: payload || {} }) })
    .then(r => r.json())
    .then(r => { if (r.error) throw new Error(r.error); return r.data; });
}

/* ---------- khởi tạo ---------- */
renderNewKho();
api('getInit').then(r => {
  KHO = r.kho || KHO; LABEL = r.labels || LABEL;
  renderNewKho();
  $('lines').innerHTML = (r.lines || []).map(t => '<option value="' + esc(t) + '">').join('');
  $('names').innerHTML = (r.names || []).map(t => '<option value="' + esc(t) + '">').join('');
}).catch(e => toast('⚠ Không kết nối được hệ thống: ' + e.message, true));

// QR trên picklist là link: .../exec?stt=..&id=..&item=..&line=..&kho=..
// Quét bằng camera điện thoại → mở app với thông tin điền sẵn.
if (IN_GAS) google.script.url.getLocation(loc => applyParams((loc && loc.parameter) || {}));
else applyParams(Object.fromEntries(new URLSearchParams(location.search)));

function applyParams(p) {
  const g = k => String(p[k] || '').trim();
  const P = { stt: g('stt'), id: g('id'), item: g('item').toUpperCase(), line: g('line'), kho: g('kho').toUpperCase() };
  if (!P.stt || !P.id) return;
  $('n-stt').value = P.stt; $('n-id').value = P.id; $('n-item').value = P.item; $('n-line').value = P.line;
  $('u-stt').value = P.stt; $('u-id').value = P.id;
  if (KHO.indexOf(P.kho) >= 0) pickNewKho(P.kho);
  const hs = $('home-scan');
  hs.style.display = 'block';
  hs.innerHTML = '<h2>📄 Đã quét picklist</h2><div class="grid">' + kv('STT', P.stt) + kv('Kho', P.kho || '—') +
    kv('ID', P.id) + kv('Line', P.line || '—') + '</div><div class="k" style="margin-top:6px">' + esc(P.item) +
    '</div><div class="hint" id="home-hint" style="margin:8px 0 0">Đang kiểm tra đơn trên hệ thống…</div>';
  api('lookupOrder', { stt: P.stt, id: P.id }).then(r => {
    if (r.ok) {
      $('home-hint').innerHTML = '✅ Đơn đã có (' + esc(r.order.status) + ') → chọn <b>Cập nhật đơn hàng cũ</b>';
      $('btn-home-upd').classList.add('rec');
    } else if (r.code === 'NOT_FOUND') {
      $('home-hint').innerHTML = '🆕 Đơn chưa có → chọn <b>Tạo đơn hàng mới</b>';
      $('btn-home-new').classList.add('rec');
    } else $('home-hint').textContent = '⚠ ' + r.msg;
  }).catch(() => { $('home-hint').textContent = ''; });
}

function homeUpd() { go('upd'); if (val('u-stt') && val('u-id')) submitUpd(); }

setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }); }, 1000);

Object.keys(GROUPS).forEach(g => GROUPS[g].forEach(id => {
  $(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); afterInput($(id), g, true); }   // máy quét gửi Enter
  });
  $(id).addEventListener('change', () => splitCombined($(id), g));
}));

/* ---------- điều hướng ---------- */
function go(name) {
  closeScan();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $('s-' + name).classList.add('on');
  document.querySelectorAll('.msg').forEach(m => { if (m.id !== 'act-warn') m.className = 'msg'; });
  if (name === 'menu') renderMenu();
  const first = { new: 'n-stt', upd: 'u-stt' }[name];
  if (first) setTimeout(() => $(first).focus(), 50);
  window.scrollTo(0, 0);
}

function resetAll() {
  Object.values(GROUPS).flat().forEach(id => $(id).value = '');
  S.order = S.action = null;          // giữ kho đã chọn cho đơn tiếp theo
  go('home');
}

function renderNewKho() {
  $('new-kho').innerHTML = KHO.map(k =>
    '<button class="' + (S.newKho === k ? 'sel' : '') + '" onclick="pickNewKho(\'' + k + '\')">' + k + '</button>').join('');
}
function pickNewKho(k) { S.newKho = k; renderNewKho(); }

/* ---------- nhập liệu / quét ---------- */
function splitCombined(inp, g) {
  const v = inp.value;
  if (v.indexOf('|') < 0) return false;
  const parts = v.split('|').map(s => s.trim());
  GROUPS[g].forEach((id, i) => { if (parts[i] !== undefined && parts[i] !== '') $(id).value = parts[i]; });
  if (g === 'new' && parts[4] && KHO.indexOf(parts[4].toUpperCase()) >= 0) pickNewKho(parts[4].toUpperCase());
  return true;
}

function afterInput(inp, g, fromEnter) {
  splitCombined(inp, g);
  inp.value = inp.value.trim();
  const next = GROUPS[g].find(id => !$(id).value.trim() && $(id) !== inp);
  if (next) $(next).focus();
  else if (fromEnter) { inp.blur(); SUBMIT[g](); }
}

let scanTarget = null, qr = null, lastHit = { t: '', at: 0 };
const FIELD_NAME = { 'n-stt': 'STT', 'n-id': 'ID', 'n-item': 'Item', 'n-line': 'Line', 'u-stt': 'STT', 'u-id': 'ID', 'a-nhan': 'Người nhận', 'a-xuat': 'Người xuất' };
const groupOf = id => Object.keys(GROUPS).find(k => GROUPS[k].indexOf(id) >= 0);

function scan(id) {
  scanTarget = id;
  if (IN_GAS || !window.Html5Qrcode) { $('photo').click(); return; }   // Apps Script chặn camera → chụp ảnh
  $('scan-err').textContent = ''; $('scan-got').textContent = '';
  setScanLabel();
  $('scanner').classList.add('on');
  if (!qr) {
    const cfg = { verbose: false };
    try { const F = Html5QrcodeSupportedFormats; cfg.formatsToSupport = [F.QR_CODE, F.CODE_128, F.CODE_39, F.DATA_MATRIX]; } catch (e) {}
    qr = new Html5Qrcode('reader', cfg);
  }
  if (qr.isScanning) return;
  qr.start({ facingMode: 'environment' }, { fps: 12, qrbox: { width: 240, height: 240 } }, onLiveScan, () => {})
    .catch(err => { $('scan-err').textContent = 'Không mở được camera (' + err + '). Hãy cho phép quyền Camera cho trình duyệt, hoặc dùng nút Chụp ảnh mã.'; });
}
function setScanLabel() {
  const g = groupOf(scanTarget), list = GROUPS[g], i = list.indexOf(scanTarget);
  $('scan-label').innerHTML = 'Quét: ' + FIELD_NAME[scanTarget] + ' <small>(' + (i + 1) + '/' + list.length + ' – quét xong tự chuyển ô kế tiếp)</small>';
}
function stopCam() {
  try { if (qr && qr.isScanning) return qr.stop().catch(() => {}); } catch (e) {}
  return Promise.resolve();
}
function closeScan() { stopCam(); $('scanner').classList.remove('on'); }

function onLiveScan(text) {
  text = String(text).trim();
  const now = Date.now();
  if (text === lastHit.t && now - lastHit.at < 2500) return;          // camera vẫn đang chĩa vào mã cũ
  const g = groupOf(scanTarget);
  if (GROUPS[g].some(id => id !== scanTarget && $(id).value.trim() === text)) return;  // mã đã điền ở ô khác
  lastHit = { t: text, at: now };
  $('reader').classList.add('hit'); setTimeout(() => $('reader').classList.remove('hit'), 400);
  if (navigator.vibrate) navigator.vibrate(60);
  const filledAll = fillScanned(text, true);
  $('scan-got').textContent = '✓ ' + (filledAll ? 'Đã điền tất cả từ QR tổng' : FIELD_NAME[scanTarget] + ': ' + text);
  const next = GROUPS[g].find(id => !$(id).value.trim());
  if (filledAll || !next) { setTimeout(closeScan, 500); return; }
  scanTarget = next; setScanLabel();
}

function scanPhoto(el) {
  const file = el.files && el.files[0];
  el.value = '';
  if (!file) return;
  $('busy').textContent = 'Đang đọc mã…'; $('busy').classList.add('on');
  decodeFile(file).then(text => {
    $('busy').classList.remove('on'); $('busy').textContent = 'Đang xử lý…';
    if (text) fillScanned(text);
    else toast('Không đọc được mã. Chụp gần hơn, mã nằm giữa và rõ nét.', true);
  });
}

// Đọc QR từ ảnh: BarcodeDetector (Android) → jsQR ở nhiều kích thước (iPhone)
async function decodeFile(file) {
  let img;
  try { img = await createImageBitmap(file); }
  catch (e) {
    img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
  }
  if ('BarcodeDetector' in window) {
    try {
      const r = await new BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39', 'data_matrix'] }).detect(img);
      if (r.length) return r[0].rawValue;
    } catch (e) {}
  }
  if (!window.jsQR) return '';
  const W = img.width, H = img.height;
  // thử ảnh nguyên và vùng giữa ảnh (60%), ở vài độ phân giải
  for (const crop of [1, 0.6]) for (const max of [1000, 700, 1400]) {
    const sw = W * crop, sh = H * crop, sx = (W - sw) / 2, sy = (H - sh) / 2;
    const k = Math.min(1, max / Math.max(sw, sh));
    const c = document.createElement('canvas');
    c.width = Math.round(sw * k); c.height = Math.round(sh * k);
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    const res = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
    if (res && res.data) return res.data;
  }
  return '';
}

function fillScanned(text, live) {
  const inp = $(scanTarget);
  text = String(text).trim();
  // quét nhầm QR dạng link picklist bằng nút 📷 → lấy tham số trong link
  const m = text.match(/[?&]stt=/) ? text : null;
  if (m) {
    const q = {}; text.split('?')[1].split('&').forEach(kv => { const a = kv.split('='); q[a[0]] = decodeURIComponent((a[1] || '').replace(/\+/g, ' ')); });
    applyParams(q); toast('✓ Đã điền từ QR picklist'); return true;
  }
  inp.value = text;
  const g = groupOf(scanTarget);
  if (splitCombined(inp, g)) return true;
  if (!live) { if (navigator.vibrate) navigator.vibrate(80); afterInput(inp, g, false); }
  return false;
}

/* ---------- gọi server ---------- */
function call(fn, payload, msgId, onOk) {
  $('busy').classList.add('on');
  api(fn, payload)
    .then(r => { $('busy').classList.remove('on'); onOk(r); })
    .catch(e => { $('busy').classList.remove('on'); showMsg(msgId, '⚠ ' + e.message, 'err'); });
}
function val(id) { return $(id).value.trim(); }

function submitNew() {
  const p = { kho: S.newKho, stt: val('n-stt'), id: val('n-id'), item: val('n-item').toUpperCase(), line: val('n-line') };
  if (!p.kho) return showMsg('msg-new', 'Vui lòng chọn kho xử lý (OG / N2).', 'err');
  if (!p.stt || !p.id || !p.item) return showMsg('msg-new', 'Vui lòng nhập đủ STT, ID, Item.', 'err');
  call('createOrder', p, 'msg-new', r => {
    if (r.ok) { S.order = r.order; toast('✓ Đã tạo đơn STT ' + r.order.stt + ' – kho ' + r.order.kho); go('menu'); return; }
    if (r.code === 'DUPLICATE') {
      S.order = r.order;
      showMsg('msg-new', '<b>⛔ ' + esc(r.msg) + '</b>' + cardHtml(r.order) +
        '<button class="big" onclick="openDup()">Mở đơn này để cập nhật</button>' +
        '<button class="big primary" onclick="resetAll()">Về trang đầu</button>', 'err', true);
      return;
    }
    showMsg('msg-new', r.msg, 'err');
  });
}
function openDup() { $('u-stt').value = S.order.stt; $('u-id').value = val('n-id'); go('upd'); submitUpd(); }

function submitUpd() {
  const p = { stt: val('u-stt'), id: val('u-id') };
  if (!p.stt || !p.id) return showMsg('msg-upd', 'Vui lòng quét đủ STT và ID.', 'err');
  call('lookupOrder', p, 'msg-upd', r => {
    if (!r.ok) return showMsg('msg-upd', r.msg, 'err');
    S.order = r.order; go('menu');
  });
}

/* ---------- menu chức năng ---------- */
function renderMenu() {
  const o = S.order;
  $('menu-card').innerHTML = cardHtml(o);
  $('menu-btns').innerHTML = ACTIONS.map(a => {
    const d = o.dates[a.key];
    return '<button class="big' + (d ? ' done' : '') + '" onclick="openAct(\'' + a.key + '\')">' +
      a.icon + ' ' + LABEL[a.key] + (d ? ' ✓' : '') +
      '<span class="sub">' + (d ? 'Đã làm lúc ' + esc(d) : 'Chưa làm') + ' · ' + a.sub + '</span></button>';
  }).join('');
}

function openAct(key) {
  S.action = key;
  const o = S.order, d = o.dates[key];
  $('act-title').textContent = ACTIONS.find(a => a.key === key).icon + ' ' + LABEL[key];
  $('act-card').innerHTML = cardHtml(o);
  if (d) showMsg('act-warn', 'Bước này đã làm lúc <b>' + esc(d) + '</b>. Xác nhận sẽ ghi đè bằng thời điểm hiện tại.', 'warn', true);
  else $('act-warn').className = 'msg warn';
  $('act-xuat').style.display = key === 'XUAT' ? 'block' : 'none';
  $('a-nhan').value = ''; $('a-xuat').value = '';
  $('a-nhan').placeholder = o.nguoiNhan ? 'Lần trước: ' + o.nguoiNhan : '';
  $('a-xuat').placeholder = o.nguoiXuat ? 'Lần trước: ' + o.nguoiXuat : '';
  go('act');
  if (key === 'XUAT') setTimeout(() => $('a-nhan').focus(), 50);
}

function confirmAct() {
  const p = { stt: S.order.stt, id: S.order.id, action: S.action };
  if (S.action === 'XUAT') {
    p.nguoiNhan = val('a-nhan'); p.nguoiXuat = val('a-xuat');
    if (!p.nguoiNhan || !p.nguoiXuat) return showMsg('msg-act', 'Vui lòng nhập Người nhận và Người xuất.', 'err');
  }
  call('doAction', p, 'msg-act', r => {
    if (!r.ok) return showMsg('msg-act', r.msg, 'err');
    S.order = r.order;
    if (S.action === 'XUAT') return showDone('Đã xuất đơn cho sản xuất');
    toast(r.msg); go('menu');
  });
}

function finish() {
  call('finishOrder', { stt: S.order.stt, id: S.order.id }, 'msg-menu', r => {
    if (!r.ok) return showMsg('msg-menu', r.msg, 'err');
    S.order = r.order; showDone('Đã kết thúc thao tác');
  });
}

function showDone(title) {
  $('done-title').textContent = title;
  $('done-card').innerHTML = cardHtml(S.order);
  go('done');
}

/* ---------- hiển thị ---------- */
function cardHtml(o) {
  return '<div class="grid">' +
    kv('STT', o.stt) + '<div><div class="k">Kho</div><div class="v"><span class="khoTag">' + esc(o.kho || '—') + '</span></div></div>' +
    kv('ID', o.id) + kv('Line', o.line || '—') +
    '<div style="grid-column:1/-1">' + '<div class="k">Item</div><div class="v">' + esc(o.item) + '</div></div></div>' +
    '<div class="status">Tình trạng: ' + esc(o.status || '—') + '</div>';
}
function kv(k, v) { return '<div><div class="k">' + k + '</div><div class="v">' + esc(v) + '</div></div>'; }
function showMsg(id, html, type, raw) {
  const m = $(id);
  m.innerHTML = raw ? html : esc(html);
  m.className = 'msg on ' + type;
  m.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
let tt;
function toast(t, err) {
  const el = $('toast');
  el.textContent = t; el.style.background = err ? 'var(--r)' : 'var(--g)';
  el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 3000);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
</script>
</body>
